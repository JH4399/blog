spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:blog-test;MODE=Oracle;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    hikari:
      minimum-idle: 1
      maximum-pool-size: 4
  sql:
    init:
      mode: always
      schema-locations: classpath:db/users-test-schema.sql
